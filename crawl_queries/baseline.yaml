extract:
  system: |-
    You are a scientific literature analyst specializing in toxicogenomics.
    You extract structured information from paper abstracts with precision.
    Always respond in valid JSON. Never add commentary outside the JSON.
  fields:
  - name: claims
    type: list
    describe: list of key scientific findings or conclusions, each as a concise statement
    describe_fulltext: list of key scientific findings, each as a concise statement - extract MORE detail
      than an abstract would provide
  - name: genes
    type: list
    describe: list of gene names/symbols mentioned (e.g. CYP1A1, NRF2, TP53)
    describe_fulltext: list of ALL gene names/symbols mentioned (e.g. CYP1A1, NRF2, TP53) - check methods,
      results, and supplementary references
    normalize:
      case: upper
      strip: '.,;:'
      drop_containing: [NOT EXPLICITLY, KEY GENES, CORE GENES, GENE EXPRESSION, SIGNATURE, PATHWAY, TOTAL,
        IMPLIED, LISTED]
      aliases:
        P53: TP53
        TRP53: TP53
        P53/TP53: TP53
        BCL-2: BCL2
        BCL-XL: BCL2L1
        BAK1: BAK1
        BAK: BAK1
        CASPASE-3: CASP3
        CASPASE3: CASP3
        CASPASE-9: CASP9
        CASPASE-8: CASP8
        CASPASE-1: CASP1
        TNF-Α: TNF
        TNFΑ: TNF
        TNF-ALPHA: TNF
        TNFA: TNF
        NF-ΚB: NFKB1
        NF-KB: NFKB1
        NF-KAPPAB: NFKB1
        NFKB: NFKB1
        NF-ΚB P65: RELA
        IL-6: IL6
        IL-1Β: IL1B
        IL-1B: IL1B
        IL-10: IL10
        IL-33: IL33
        IL-1: IL1B
        NRF2: NFE2L2
        NRF1: NFE2L1
        KEAP-1: KEAP1
        PPARΑ: PPARA
        PPAR-ALPHA: PPARA
        PPAR-Α: PPARA
        PPARα: PPARA
        RXRΑ: RXRA
        HIF-1Α: HIF1A
        HIF-1A: HIF1A
        PGC1Α: PPARGC1A
        PGC-1Α: PPARGC1A
        PGC1A: PPARGC1A
        FOXO3A: FOXO3
        ERΑ: ESR1
        CYTOCHROME P450: CYP
        CYP 1A1: CYP1A1
        CYP 2E1: CYP2E1
        TGF-Β: TGFB1
        TGF-B: TGFB1
        TGF-BETA: TGFB1
        TGFB: TGFB1
        TNF-Β: LTA
        VEGF: VEGFA
        VEGF-A: VEGFA
        HGF: HGF
        FGF-21: FGF21
        GDF-15: GDF15
        P21: CDKN1A
        P27: CDKN1B
        P62: SQSTM1
        BECLIN-1: BECN1
        ERK: MAPK1
        ERK1/2: MAPK1
        JNK: MAPK8
        P-AKT: AKT1
        AKT: AKT1
        P-AMPK: PRKAA1
        AMPK: PRKAA1
        MTOR: MTOR
        PI3K: PIK3CA
        HMOX1: HMOX1
        HMOX-1: HMOX1
        HO-1: HMOX1
        SOD: SOD1
        SOD1: SOD1
        SOD2: SOD2
        GPX: GPX1
        COX-2: PTGS2
        COX2: PTGS2
        DRP-1: DNM1L
        DRP1: DNM1L
        MFN-2: MFN2
        KIM-1: HAVCR1
        KIM1: HAVCR1
        NGAL: LCN2
        HSP90: HSP90AA1
        HSP70: HSPA1A
        SIRT-1: SIRT1
        DJ-1/PARK7: PARK7
        DJ-1: PARK7
  - name: organs
    type: list
    describe: list of organs/tissues studied (e.g. liver, kidney, heart)
    describe_fulltext: list of organs/tissues studied
    normalize:
      case: lower
      aliases:
        hepatocytes: liver
        hepatocyte: liver
        hepatic: liver
        renal: kidney
        kidneys: kidney
        lungs: lung
        hearts: heart
        brains: brain
        cerebellum: brain
        hippocampus: brain
        cortex: brain
        frontal cortex: brain
        striatum: brain
        amygdala: brain
        nervous system: brain
        cardiovascular system: heart
        pulmonary system: lung
        gastrointestinal tract: intestine
        gut: intestine
        colon: intestine
        colorectal tissue: intestine
        rectum: intestine
        esophagus: stomach
        gallbladder: liver
        bile duct: liver
        breast tissue: breast
        skeletal muscle: muscle
        plasma: blood
        peripheral blood mononuclear cells (pbmc): blood
  - name: methods
    type: list
    describe: list of methods used (e.g. microarray, RNA-seq, qPCR, WGCNA)
    describe_fulltext: list of methods used
  - name: species
    type: list
    describe: list of species (e.g. rat, human, mouse)
    describe_fulltext: list of species
  - name: dose_response
    type: list
    fulltext_only: true
    describe: any dose-response relationships mentioned, including specific concentrations/doses
  - name: stance
    type: text
    describe: 'one of: supports_consensus, challenges_consensus, neutral, novel_finding'
  - name: confidence
    type: number
    describe: 0.0 to 1.0
  - name: summary
    type: text
    describe: one-sentence summary of the paper's main contribution to toxicogenomics
    describe_fulltext: 2-3 sentence summary of the paper's main contribution
  chunk:
    max_chars: 30000
    overlap: 2000
  model: claude-haiku-4-5
  workers: 6
