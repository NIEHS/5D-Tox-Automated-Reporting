# The new interface's own routes (/api/v2/…), added to the API page's guide
# (web_routes/api_guide.yaml; the format is described there).

groups:

  - key: studies
    order: 5
    title: Studies
    about: >
      The list of studies the server holds, and creating, opening and deleting
      one. A study is filed under its test article's identifier (DTXSID).
    operations:
      - op: GET /api/v2/studies
        title: List every study, grouped by chemical
        does: >
          Under each chemical: the study or the report first, then a report's
          member studies and its published content. The chemical changed most
          recently comes first.
        reads: the study store, one folder per study.
        code: ui_api.studies.list_studies
      - op: GET /api/v2/studies/{dtxsid}
        title: Show one study's entry in the list, with its details
        code: ui_api.studies.study_summary
      - op: GET /api/v2/chemicals/{dtxsid}
        title: Look up the chemical a DTXSID names
        does: Asks PubChem; it takes a few seconds. Nothing is saved.
      - op: GET /api/v2/chemicals/{dtxsid}/structure.png
        title: Show the chemical's structure drawing
      - op: GET /api/v2/studies/{dtxsid}/creation-check
        title: Check whether a study can be created under a DTXSID
      - op: POST /api/v2/studies
        title: Create a study
        does: >
          A study is created with the chemical identity a person confirmed
          from the lookup, or with its identity marked as still to be
          confirmed.
        writes: a new folder in the study store.
      - op: PUT /api/v2/studies/{dtxsid}/identity
        title: Fill in a study's missing chemical identity from a confirmed lookup
        writes: "`identity.json`."
      - op: GET /api/v2/studies/{dtxsid}/delete-preview
        title: Show what deleting a study would delete, keep and lose
        does: A rehearsal; nothing is deleted.
      - op: POST /api/v2/studies/{dtxsid}/delete
        title: Delete a study for good
        does: >
          Accepted only with the study's identifier typed out and the token of
          the rehearsal above, so that what is deleted is what was shown.

      - op: POST /api/v2/demo/{report}/reset
        title: Put a report's live copy back to its start state
        does: >
          For a demonstration, a finished report can have a live copy: the
          same files, checked, with the same study facts stated, and nothing
          combined or computed yet. This deletes the live copy and builds it
          again from the finished report, which is only read. It is refused
          while a long act is running on the copy.
        reads: the finished report's files and declarations.
        writes: the live copy's folders.
        code:
          - ui_api.demo.reset_live_copy
          - tooling.demo_copy.reset

  - key: dataset
    operations:
      - op: GET /api/v2/studies/{dtxsid}/dataset
        title: Show a study's files and the dataset combined from them (new interface)
        does: >
          Before the files are combined: each file with what the file check
          recognized in it, and for each assay the workbook, the table
          converted from it and the BMDExpress project. After: the
          experiments of the dataset, the file each assay's data was taken
          from, whether the study's own benchmark dose analysis is in the
          dataset, and the summary of the animal accounting. Nothing is
          changed by asking.
        reads: >
          `_fingerprints.json`, `validation_report.json`, the converted
          tables' `.sidecar.json` files, `integrated.json` (through the
          loader that checks its form), `animal_report.json`.
        code: ui_api.dataset.study_dataset
        notebook: 8. Integrate
      - op: POST /api/v2/studies/{dtxsid}/integrate
        title: Combine the files into one dataset, then account for every animal (new interface)
        does: >
          The two steps run one after the other, as one act, and the answer
          arrives as a stream of lines: a line when each step starts and
          ends, then the result. It is refused before it starts when the
          files have not passed the check, while another long act runs on
          the study, and on the finished report of a demonstration pair.
        reads: the checked files, and the study's recorded chemical identity (`identity.json`).
        writes: >
          `integrated.json` and the per-animal details beside it,
          `integration_basis.json`, `animal_report.json`. Results computed
          from an earlier dataset are removed.
        code:
          - ui_api.dataset.start_integrate
          - workflow.steps.integrate_step
          - workflow.steps.generate_animal_report_step
        notebook: 8. Integrate
      - op: GET /api/v2/studies/{dtxsid}/tables
        title: List the results tables of a study's report (new interface)
        does: >
          One entry for each results section the analysis wrote, with its
          assay, its sexes and whether it prints benchmark doses.
        reads: the results sections (`bm2_*.json`).
        code: ui_api.dataset.result_tables
      - op: GET /api/v2/studies/{dtxsid}/tables/{key}/sources
        title: Follow one results table back to the files it was built from (new interface)
        does: >
          For each sex of the table: its rows, the experiment of that assay
          and sex in the dataset, the file the dataset says the data was
          taken from, and the workbook that file was converted from. For the
          benchmark doses it says whether they are the study's own analysis
          or were fit by this application, at which benchmark response.
          Every link is a record read as written; where a record is missing,
          the answer says at which link the chain stops.
        reads: >
          the results section, `integrated.json` (through the loader that
          checks its form), `_fingerprints.json`, the converted tables'
          `.sidecar.json` files, and the record of the benchmark dose method
          the last analysis kept.
        code:
          - ui_api.dataset.table_sources
          - tables.apical_bmds.apical_bmd_method

  - key: process
    operations:
      - op: POST /api/v2/studies/{dtxsid}/process
        title: Run the analysis, then write the results sections and the Summary (new interface)
        does: >
          Runs the whole analysis under the method and the study facts
          already fixed for the study; no setting is taken from the request.
          The answer arrives as a stream of lines: each unit of work as it
          is computed or reused, then the result, which names what was
          computed and what was reused, the sections written, the approvals
          the new numbers withdrew, and how many citations the check
          removed. It is refused before it starts when the data has not been
          reviewed, when no person has chosen the method, when a study fact
          is missing, while another long act runs on the study, and on the
          finished report of a demonstration pair.
        reads: >
          `integrated.json`, the per-animal details beside it, the pinned
          method, the stated study facts, the knowledge base.
        writes: >
          the results of each unit of work, the results sections
          (`bm2_*.json`), `summary.json`, `references.json`, the study's
          database.
        code:
          - ui_api.process_run.start_process
          - workflow.steps.process_step
          - workflow.steps.materialize_result_sections
          - workflow.steps.materialize_summary
        notebook: 12. Process

  - key: facts
    operations:
      - op: GET /api/v2/vocabularies
        title: List the permitted values for study facts
        does: >
          The controlled lists (species, strains, routes, vehicles, organs and
          the rest) a study fact must be chosen from, and the form an
          identifier must have.

  - key: review
    operations:
      - op: GET /api/v2/studies/{dtxsid}/state
        title: Show everything the interface knows about a study, in one answer
        does: >
          The study's phase, the actions permitted in it, its chemical, the
          analysis method and report definition fixed for it, every section
          with its state, and whether the report may be published. All of it
          is worked out from the study's files each time it is asked; nothing
          is changed by asking.
        code: ui_api.read_model.study_state
        notebook: 17. Where things stand
      - op: POST /api/v2/studies/{dtxsid}/sections/{key}/accept
        title: Approve a section as it stands (new interface)
        does: The section's text is never changed by approving it.
        code: workflow.steps.accept_section_step
        notebook: 14. Sections and the publish gate
      - op: POST /api/v2/studies/{dtxsid}/sections/{key}/release
        title: Reopen an approved section, with a reason (new interface)
        does: The reason is kept in the section's history.
        code: workflow.steps.release_section_step
      - op: POST /api/v2/studies/{dtxsid}/sections/{key}/restore
        title: Bring back an earlier version of a section (new interface)
        does: The earlier text returns as a new version, not approved; approving it is a separate act.
        code: workflow.steps.restore_section_step
      - op: GET /api/v2/studies/{dtxsid}/sections/{key}/history
        title: List a section's versions and what happened to each
        code: workflow.section_writes.section_history
      - op: GET /api/v2/studies/{dtxsid}/sections/{key}/history/{version}
        title: Show one version of a section
