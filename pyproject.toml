[project]
name = "bmdx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bmdx-pipe",
    "anthropic>=0.82.0",
    "beautifulsoup4>=4.12.0",
    "duckdb>=1.2.0",
    "fastapi>=0.115.0",
    "javaobj-py3>=0.4.4",
    "lmdb>=1.7.5",
    "networkx>=3.6.1",
    "openpyxl>=3.1.5",
    "orjson>=3.11.7",
    "pandas>=2.2.0",
    "pybmds>=25.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.31",
    "requests>=2.33.0",
    "scipy>=1.14.0",
    "uvicorn>=0.34.0",
    "watchfiles>=1.1.1",
    "plotly>=6.6.0",
    "kaleido>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Pure function tests, no I/O",
    "integration: TestClient tests with mocked externals",
    "e2e: Full pipeline smoke tests",
]
# Exclude e2e tests from default runs.  The e2e suite's `_step_impl`
# helper (tests/e2e/conftest.py) calls page.pause() between every step
# to open Playwright Inspector for interactive review, which hangs any
# unattended invocation of `pytest tests/`.  Opt in explicitly with
# `pytest -m e2e` or `pytest tests/e2e/ -m e2e`.  See the todo.md entry
# "E2e test default: skip interactive pauses" for the deeper fix.
addopts = "--tb=short -q -m 'not e2e'"

[tool.uv.sources]
bmdx-pipe = { path = "../bmdx-pipe", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.58.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-playwright>=0.7.2",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ruff>=0.16",
]

# ---------------------------------------------------------------------------
# Lint gate (CI). Deliberately narrow baseline: pyflakes (real bugs: undefined
# names, unused imports) + the syntax/import/statement subset of pycodestyle.
# Style rules (line length, naming, docstrings) are NOT enforced. Widen this
# incrementally; every rule added should be fixed across the tree in the same
# commit so the gate stays green.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["notebooks", "web_wizard", "wizard-ui", "citegraph_output*", "java", "latex"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# E402: several modules deliberately import after side-effectful setup
#       (FastAPI app construction, sys.path/env handling).
# E702: semicolon-joined statements are used as a compact style in the docx
#       emitter's OOXML plumbing; cosmetic, not a bug class.
# E741: ambiguous single-letter names — cosmetic.
# F841: unused local variables — real but low-value; tighten later.
ignore = ["E402", "E702", "E741", "F841"]

[tool.ruff.lint.per-file-ignores]
# Re-export facades: imports ARE the public API (ADR-0013 backward-compat).
"__init__.py" = ["F401"]
"pipeline/pool_orchestrator.py" = ["F401"]
"narrative/methods_report.py" = ["F401"]
"narrative/interpret.py" = ["F401"]
# Accessor facade: other modules import these names FROM server_state.
"web_routes/server_state.py" = ["F401"]
# `find_sidecar_paths` is imported from here by sibling table builders.
"tables/body_weight_table.py" = ["F401"]
