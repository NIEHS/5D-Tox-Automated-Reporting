# Faithful structure of NIEHS Report 10 (the reference report) as an INSTANCE of the
# document grammar (ADR-0025).  Derived 2026-09-25 from examples/NIEHS-10 PFHxSAm_Final.docx
# (paragraph styles + outline levels, tables, drawings, section breaks, and the 55
# supplementary-material entries of Appendix F, in body order).
#
# This file VALIDATES (tests/unit/test_bits_profile.py loads it through the real
# instantiator) and is the grammar's first acceptance instance.  Bindings are honest:
#   - body + flat front matter: the presets the shipped template uses (llm / programmatic);
#   - the abstract is `binding: llm`, References `binding: derived`;
#   - appendix prose the app does not write is `freeform-block` (role sec, authored) with
#     an inline dual-source stub in place of the reference's text;
#   - appendix data tables / data figures the pipeline does not build yet are `data-table`
#     / `figure` (subtype chart) bound to the data_key the pipeline OWES — they render as
#     visible "[... pending]" notes until that artifact exists;
#   - the flowcharts of Appendix D are authored figures (subtype diagram, content_file);
#   - Appendix F's four parts hold one `supplementary-material` node per supplied file.
# Appendix titles carry no "Appendix X." prefix: the letter is positional
# (compute_appendix_letters).  Landscape orientation follows the docx section breaks.
