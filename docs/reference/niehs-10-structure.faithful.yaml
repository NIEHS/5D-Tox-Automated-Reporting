# Faithful structure of NIEHS Report 10 (the reference report), derived 2026-09-25
# from examples/NIEHS-10 PFHxSAm_Final.docx (paragraph styles + outline levels, tables,
# drawings and section breaks in body order; cross-checked against the reference PDF).
# One node per heading / table / figure, typed as naturally as the template grammar
# allows. Landscape orientation follows the docx section breaks. NOT valid against the
# grammar: see docs/reference/niehs-10-structure.findings.md for every violation.
# Appendix F's four parts each hold a supplementary-material LIST (55 title + filename
# entries in the docx), a construct the grammar has no node for; they appear as narratives.
document:
- region: front
  children:
  - id: title-page
    type: title-page
    title: Title Page
    subtype: niehs-5d-tox
  - id: foreword
    type: front-matter
    title: Foreword
    data_key: foreword
  - id: table-of-contents
    type: toc
    title: Table of Contents
  - id: tables
    type: tables-list
    title: Tables
  - id: about-this-report
    type: front-matter
    title: About This Report
    data_key: about_report
    children:
    - id: authors
      type: heading-only
      title: Authors
    - id: contributors
      type: heading-only
      title: Contributors
  - id: peer-review
    type: front-matter
    title: Peer Review
    data_key: peer_review
  - id: publication-details
    type: front-matter
    title: Publication Details
    data_key: publication_details
  - id: acknowledgments
    type: front-matter
    title: Acknowledgments
    data_key: acknowledgments
  - id: abstract
    type: front-matter
    title: Abstract
    data_key: abstract
