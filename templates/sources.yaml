# The definitions' source library: the boilerplate sources.
#
# What a report of this kind cites whatever the study: the statistical
# procedures, the software.  It belongs to the document definitions (every
# definition and era template may cite an entry) and is kept once, here.
# ADR-0038; read by narrative.sources.load_library.
#
# An entry's key is what text cites it by: [[cite:<key>]].  The numbers and the
# reference list are derived from what a presented report prints, so an entry
# is listed only in a report whose text cites it.
#
#   kind       paper | book | report | dataset | software | website | other
#   authors, title, container (journal or publisher), year, volume, issue,
#   pages, doi, url, accessed
#   cited_at   where the Materials and Methods cite it by rule: at the first
#              mention of the words `after` in the subsection `methods`
#              (narrative.methods_models.SUBSECTION_SKELETON keys).  `after`
#              may list alternatives; the first that occurs is used.  A
#              subsection that does not use the words does not cite the entry.
#
# The entries are the published NIEHS reports' own (NIEHS Report 12,
# references 18 to 26), field by field.

