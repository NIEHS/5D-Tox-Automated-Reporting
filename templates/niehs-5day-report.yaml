# niehs-5day-report.yaml — the data-driven document template (ADR-0003).
#
# A template is DATA: an ordered, nested selection of component types from the
# catalog (render_capabilities.COMPONENT_CATALOG).  The instantiator
# (document_template.py) turns this into the canonical DocNode tree that the
# renderers and navigation panel consume — so DOCUMENT_TREE is now the OUTPUT
# of instantiating this file, not a hand-written Python literal.
#
# What a node entry carries (everything else is computed, not authored):
#   id            — stable identifier (matches navigation-panel node ids)
#   type          — a catalog component type (drives rendering + capabilities)
#   title         — heading / table title text
#   data_key      — key in the report-data dict holding this node's content
#   platform      — for table nodes: which platform's data to render
#   narrative_key — for narrative+tables / genomics: key in unified_narratives
#   ready_key     — Alpine store ready-flag gating the navigation panel
#   methods_key   — for M&M subsections: key in data["methods"]["sections"]
#   children      — nested node entries
#
# NOT authored here (derived by the instantiator / numbering pre-pass):
#   level         — 0 if the type is headingless, else nesting depth
#   table_number / figure_number — positional, assigned by a tree-walk pass
#
# The golden-tree test (tests/unit/test_document_template.py) asserts that
# instantiating this file reproduces the frozen DOCUMENT_TREE byte-for-byte.

# ── Structural pages (headingless) ───────────────────────────────────
- id: cover
  type: cover
  title: "Cover Page"
- id: title-page
  type: title-page
  title: "Title Page"

# ── Table of Contents (generated front-matter component; native
#    \tableofcontents in the LaTeX export) ─────────────────────────────
- id: toc
  type: toc
  title: "Table of Contents"

# ── Front matter (roman-numeral pages) ───────────────────────────────
- id: foreword
  type: front-matter
  title: "Foreword"
  data_key: foreword
- id: tables-list
  type: tables-list
  title: "Tables"
