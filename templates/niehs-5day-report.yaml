      title: Chemistry
      data_key: methods
      methods_key: chemistry
    - id: mm-clin-exam
      type: heading-only
      title: Clinical Examinations and Sample Collection
      data_key: methods
      methods_key: clinical_exams
      children:
      - id: mm-clin-obs
