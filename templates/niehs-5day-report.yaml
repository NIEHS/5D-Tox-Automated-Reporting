# niehs-5day-report.yaml — the data-driven document template (ADR-0003).
#
# Top-level is THREE region containers (ADR-0004 amendment d) that project
# directly to BITS <front-matter> / <book-body> / <book-back>:
#
#   - region: front   — title page, foreword, ToC, authors, ..., abstract
#   - region: body    — background, methods, results, summary, references
#   - region: back    — appendices A–F
#
# ADR-0028: the structure corresponds one-to-one with the published BITS book.
# Each top-level node names the BITS part it becomes — `element` (book-meta,
# abstract, foreword, front-matter-part, book-part, book-app) and
# `book_part_type` (the @book-part-type) — so this file reads like the book's
# part list.  Print-only nodes (toc, tables-list) name no element: Bookshelf
# generates its own table of contents.  Nested nodes project by their role
# (sec, table-wrap, fig); flow content (tables, figures) must come before a
# section's sub-sections, and section labels inside appendices ("C.1") are
# computed, never written into titles.
# Each region's `children` are the node entries; the instantiator inherits
# `region` from the container onto every descendant (so any node knows its
# region without a separate type lookup).  The page-numbering switch
# (roman → arabic) and a future BITS export both read node.region directly.
#
# Node-entry fields (everything else is computed):
#   id, type, title, data_key, platform, narrative_key, ready_key,
#   methods_key, orientation, caption, children, element, book_part_type, parts.
# Computed: level (depth or 0 if headingless), table_number/figure_number
# (positional), sec_label (appendix sections), region (inherited from the
# container).
#
# The golden-tree test (tests/unit/test_document_template.py) asserts that
# instantiating this file reproduces the frozen DOCUMENT_TREE byte-for-byte.
#
# This file is a MAPPING whose top-level keys are:
#   document:    the region containers + node entries (the document structure);
#   book_meta:   the report SERIES facts BITS writes into <collection-meta> /
#                <book-meta> (ADR-0028 §6) — collection, series + ISSN,
#                publisher, permissions; study facts come from the data;
#   chart_style: optional per-instance chart styling (see chart_style.py);
#   chart_types: optional data-driven chart-type declarations (chart_registry).
# load_template() returns the `document` list unchanged, so the golden tree is
# unaffected by the chart blocks.  A bare list (no `document:` key) is still
# accepted for legacy/test scaffolds.

document:
- region: front
  children:
  # No cover page: the NIEHS-10 reference DOCX opens directly on the title page
  # (the branded page-1 cover in the PDF was a PDF-production artifact, not part
  # of the source document).  The title page is therefore the first front node
  # on every surface.
  - id: title-page
    type: title-page
    title: Title Page
    subtype: niehs-5d-tox
    element: book-meta        # the book title + subtitle (ADR-0028 §6)
  # Page breaks are NOT structural nodes — they are declared in the `styles`
  # block below as `break_before: page` on the node that should start a new page
  # (see the header note there).  This keeps pagination a single surface-agnostic
  # spec that composes idempotently with the dotx's own style breaks on docx.
  - id: foreword
    type: front-matter
    title: Foreword
    data_key: foreword
    element: foreword
    book_part_type: foreword
  - id: toc
    type: toc
    title: Table of Contents
  - id: tables-list
    type: tables-list
    title: Tables
  # Authors and Contributors are two front-matter parts in the published book
  # (fm-authors / fm-contribs), filled from the session's front_matter.json.
  - id: authors
    type: front-matter
    title: Authors
    data_key: authors
    element: front-matter-part
    book_part_type: authors
  - id: contributors
    type: front-matter
    title: Contributors
    data_key: contributors
    element: front-matter-part
    book_part_type: contributors
  - id: peer-review
    type: front-matter
    title: Peer Review
    data_key: peer_review
    element: front-matter-part
    book_part_type: peer-review
  - id: publication
    type: front-matter
    title: Publication Details
    data_key: publication_details
    element: front-matter-part
    book_part_type: section
  - id: acknowledgments
    type: front-matter
    title: Acknowledgments
    data_key: acknowledgments
    element: front-matter-part
    book_part_type: acknowledgments
  # The abstract lives in <book-meta>; its four parts are declared, so a part
  # with no text yet shows as pending instead of silently vanishing.
  - id: abstract
    type: front-matter
    title: Abstract
    data_key: abstract
    element: abstract
    parts: [Background, Methods, Results, Summary]
- region: body
  children:
  - id: background
    type: narrative
    title: Background
    data_key: background
    element: book-part
    book_part_type: section
  - id: methods
    type: heading-only
    title: Materials and Methods
    data_key: methods
    element: book-part
    book_part_type: section
    binding: llm   # the section's prose (its subsections) is LLM-generated (ADR-0025)
    children:
    - id: mm-study-design
      type: narrative
      title: Study Design
      data_key: methods
      methods_key: study_design
    - id: mm-dose-rationale
      type: narrative
      title: Dose Selection Rationale
      data_key: methods
      methods_key: dose_selection
    - id: mm-chemistry
      type: narrative
      title: Chemistry
      data_key: methods
      methods_key: chemistry
    - id: mm-clin-exam
      type: heading-only
      title: Clinical Examinations and Sample Collection
      data_key: methods
      methods_key: clinical_exams
      children:
      - id: mm-clin-obs
        type: narrative
        title: Clinical Observations
        data_key: methods
        methods_key: clinical_obs
        requires_platform: Clinical Observations
        not_collected_text: "Clinical observations were not evaluated in this study."
      - id: mm-body-organ-wt
        type: narrative
        title: Body and Organ Weights
        data_key: methods
        methods_key: body_organ_weights
        requires_platform: [Body Weight, Organ Weight]
        not_collected_text: "Body and organ weights were not evaluated in this study."
      - id: mm-clin-path
        type: narrative
        title: Clinical Pathology
        data_key: methods
        methods_key: clinical_pathology
        requires_platform: [Clinical Chemistry, Hematology, Hormones]
        not_collected_text: "Clinical pathology was not evaluated in this study."
      - id: mm-internal-dose
        type: narrative
        title: Internal Dose Assessment
        data_key: methods
        methods_key: internal_dose
        requires_platform: Tissue Concentration
        not_collected_text: "Internal dose was not assessed in this study."
    - id: mm-transcriptomics
      type: heading-only
      title: Transcriptomics
      data_key: methods
      methods_key: transcriptomics
      requires_platform: gene_expression
      not_collected_text: "Transcriptomic analyses were not performed in this study."
      children:
      - id: mm-tx-sample
        type: narrative
        title: Sample Collection for Transcriptomics
        data_key: methods
        methods_key: txomics_sample
      - id: mm-tx-rna
        type: narrative
        title: RNA Isolation, Library Creation, and Sequencing
        data_key: methods
        methods_key: txomics_rna
      - id: mm-tx-processing
        type: narrative
        title: Sequence Data Processing
        data_key: methods
        methods_key: txomics_seq_processing
      - id: mm-tx-qc
        type: narrative
        title: Sequencing Quality Checks and Outlier Removal
        data_key: methods
        methods_key: txomics_qc
        children:
        # Table 1 sits inside the section that reports the sample QC, as in
        # the published book (a table may not follow a sibling sub-section).
        - id: table-sample-counts
          type: sample-counts-table
          title: Final Sample Counts for Benchmark Dose Analysis of the Transcriptomics Data
          data_key: sample_counts
          caption: Final Sample Counts for Benchmark Dose Analysis of the Transcriptomics Data
      - id: mm-tx-norm
        type: narrative
        title: Data Normalization
        data_key: methods
        methods_key: txomics_normalization
    - id: mm-data-analysis
      type: heading-only
      title: Data Analysis
      data_key: methods
      methods_key: data_analysis
      children:
      - id: mm-stat-apical
        type: narrative
        title: Statistical Analysis of Body Weights, Organ Weights, and Clinical Pathology
        data_key: methods
        methods_key: stat_analysis
        requires_platform: [Body Weight, Organ Weight, Clinical Chemistry, Hematology, Hormones]
        not_collected_text: "Apical endpoints were not evaluated in this study."
      - id: mm-bmd-apical
        type: narrative
        title: Benchmark Dose Analysis of Body Weights, Organ Weights, and Clinical Pathology
        data_key: methods
        methods_key: bmd_apical
        requires_platform: [Body Weight, Organ Weight, Clinical Chemistry, Hematology, Hormones]
        not_collected_text: "Apical endpoints were not evaluated in this study."
      - id: mm-bmd-tx
        type: narrative
        title: Benchmark Dose Analysis of Transcriptomics Data
        data_key: methods
        methods_key: bmd_genomics
        requires_platform: gene_expression
        not_collected_text: "Transcriptomic analyses were not performed in this study."
      - id: mm-fdr
        type: narrative
        title: Empirical False Discovery Rate Determination for Genomic Dose-response Modeling
        data_key: methods
        methods_key: efdr
        requires_platform: gene_expression
        not_collected_text: "Transcriptomic analyses were not performed in this study."
      - id: mm-data-access
        type: narrative
        title: Data Accessibility
        data_key: methods
        methods_key: data_accessibility
  - id: results
    type: heading-only
    title: Results
    element: book-part
    book_part_type: section
    children:
    - id: animal-condition
      type: narrative+tables
      title: Animal Condition, Body Weights, and Organ Weights
      narrative_key: animal_condition
      ready_key: animalCondition
      children:
      - id: table-body-weight
        type: table
        title: Summary of Body Weights
        platform: Body Weight
        orientation: landscape
        ready_key: animalCondition
      - id: table-organ-weight
        type: table
        title: Summary of Organ Weights
        platform: Organ Weight
        orientation: landscape
        ready_key: animalCondition
    - id: clinical-path
      type: narrative+tables
      title: Clinical Pathology
      narrative_key: clinical_pathology
      ready_key: clinicalPath
      children:
      - id: table-clin-chem
        type: table
        title: Summary of Select Clinical Chemistry Data
        platform: Clinical Chemistry
        orientation: landscape
        ready_key: clinicalPath
      - id: table-hematology
        type: table
        title: Summary of Select Hematology Data
        platform: Hematology
        orientation: landscape
        ready_key: clinicalPath
      - id: table-hormones
        type: table
        title: Summary of Select Hormone Data
        platform: Hormones
        orientation: landscape
        ready_key: clinicalPath
    - id: internal-dose
      type: narrative+tables
      title: Internal Dose Assessment
      narrative_key: internal_dose
      ready_key: internalDose
      children:
      - id: table-tissue-conc
        type: table
        title: Summary of Plasma Concentration Data
        platform: Tissue Concentration
        ready_key: internalDose
    - id: bmd-summary
      type: bmd-summary
      title: Apical Endpoint Benchmark Dose Summary
      caption: "BMD, BMDL, LOEL, and NOEL Summary for Apical Endpoints, Sorted by BMD or LOEL from Low to High"
      data_key: bmd_summary
      ready_key: bmdSummary
    - id: gene-sets
      type: genomics-section
      title: Gene Set Benchmark Dose Analysis
      data_key: genomics_sections
      narrative_key: gene_set_narrative
      ready_key: geneSets
    - id: gene-bmd
      type: genomics-section
      title: Gene Benchmark Dose Analysis
      data_key: genomics_sections
      narrative_key: gene_narrative
      ready_key: geneBmd
  - id: summary
    type: narrative
    title: Summary
    data_key: summary
    element: book-part
    book_part_type: section
  # References is the last BODY part in the published book: a book-part whose
  # <back> holds the numbered <ref-list> (ADR-0028 §5).
  - id: references
    type: reference-list
    title: References
    data_key: references
    element: book-part
    book_part_type: section
- region: back
  children:
  # Appendices D/E carry AUTHORED static content shared by every study (BMD
  # rules table, organ descriptions) as a freeform-block child — dual-surface,
  # one .tex + one .html per appendix under templates/freeform/.  Appendices A/F
  # are STUDY-SPECIFIC (a chemical's plasma method, its supplemental files):
  # `session_content` resolves them per study, never from the shared template.  Appendix B renders the data-derived animal
  # roster (no child).  Appendix C carries the PCA figure (computed from the
  # integrated expression data) and a pending eFDR figure (not ingested yet).
  # Appendix titles carry ONLY the descriptive name — the "Appendix A." letter
  # prefix is assigned positionally by compute_appendix_letters() and composed by
  # the renderers (and drives docx chapter-relative page numbering).  Do NOT bake
  # the letter into the title.
  - id: appendix-a
    type: appendix
    element: book-app
    book_part_type: appendix
    title: Internal Dose Assessment
    children:
    - id: appendix-a-body
      type: freeform-block
      title: ""
      # The plasma analytical method is study-specific: supplied per study
      # (sessions/<dtxsid>/authored/ or templates/studies/<dtxsid>/), never shared.
      session_content: appendix-a
      requires_platform: Tissue Concentration
      not_collected_text: "Internal dose was not assessed in this study."
  - id: appendix-b
    type: appendix
    element: book-app
    book_part_type: appendix
    title: Animal Identifiers
    children:
    # The animal roster is an ordinary programmatic matrix table (ADR-0025):
    # its "Table B-1" label comes from the appendix-scoped numbering pass, its
    # rows from data[appendix_animals_matrix] (built from animal_report.json).
    - id: table-b-1
      type: data-table
      title: Animal Numbers and FASTQ Data File Names
      data_key: appendix_animals_matrix
  - id: appendix-c
    type: appendix
    element: book-app
    book_part_type: appendix
    title: Transcriptomic Quality Control and Empirical False Discovery Rate
    children:
    # C.1: PCA of the modeled expression matrix, computed from the integrated
    # gene-expression experiments (genomics/pca_figure.py) — one figure, a row
    # of three panels per tissue x sex.
    - id: appendix-c-qc
      type: heading-only
      title: Gene Expression Quality Control
      children:
      - id: appendix-c-qc-text
        type: freeform-block
        title: ""
        content_file:
          latex: freeform/appendix-c.tex
          html: freeform/appendix-c.html
      - id: figure-c-pca
        type: figure
        subtype: chart
        title: Principal Component Analysis of the Normalized Transcriptomic Data
        data_key: appendix_pca_figure
    # C.2: the empirical FDR comes from a synthetic-null BMDExpress analysis
    # supplied with the study (e.g. NIEHS-13's *_eFDR_Synthetic_Null_Analysis);
    # the pipeline does not ingest it yet, so the figure shows its pending note.
    - id: appendix-c-efdr
      type: heading-only
      title: Empirical False Discovery Rate
      children:
      - id: figure-c-efdr
        type: figure
        subtype: chart
        title: Boxplots of the False Positive Gene and Gene Ontology Biological Process Rates for Each Tissue per Sex Combination
        data_key: appendix_efdr_figure
  # Appendix D: how apical BMDs are accepted. D-1 is built from the classifier's
  # own thresholds (bmdx_pipe.bmd_acceptance via rendering/bmd_appendix.py), D-2
  # from each bMDResult.analysisInfo — so neither can describe a method other
  # than the one the tables were produced with.  (NIEHS Report 10 printed the
  # BMDS 2.7 model-selection rules here; this pipeline never runs BMDS 2.7.)
  - id: appendix-d
    type: appendix
    element: book-app
    book_part_type: appendix
    title: Benchmark Dose Modeling and Acceptance Criteria
    children:
    - id: appendix-d-body
      type: freeform-block
      title: ""
      content_file:
        latex: freeform/appendix-d.tex
        html: freeform/appendix-d.html
    - id: table-d-1
      type: data-table
      title: Benchmark Dose Acceptance Criteria for Apical Endpoints
      data_key: appendix_bmd_acceptance_matrix
    - id: table-d-2
      type: data-table
      title: BMDExpress/ToxicR Analysis Configuration
      data_key: appendix_bmd_config_matrix
  - id: appendix-e
    type: appendix
    element: book-app
    book_part_type: appendix
    title: Organ Weight Descriptions
    children:
    - id: appendix-e-descriptions
      type: heading-only
      title: Organ Weight Descriptions
      children:
      - id: appendix-e-body
        type: freeform-block
        title: ""
        content_file:
          latex: freeform/appendix-e.tex
          html: freeform/appendix-e.html
  - id: appendix-f
    type: appendix
    element: book-app
    book_part_type: appendix
    title: Supplemental Data
    children:
    - id: appendix-f-body
      type: freeform-block
      title: ""
      # The supplemental file list is study-specific (a per-study appendix-f.json
      # list, or authored appendix-f.html/.tex), never shared across chemicals.
      session_content: appendix-f
      missing_content_text: "Supplemental data files are not available for this study."
  # ── Freeform AUTHORED content (commented out — feature ships dormant) ──────
  # freeform-page / freeform-block carry content authored HERE (or in an
  # external file), not read from the pipeline.  Uncomment + adapt to insert a
  # one-off legal page, an externally-written appendix, a pasted block, etc.
  # See freeform_content.py and render_capabilities (COMPONENT_CATALOG).
  #
  # Authoring rules (validated at load):
  #   - exactly ONE of `content` (inline) or `content_file` (path under
  #     templates/);
  #   - `representation` ∈ {latex, html, docx}, REQUIRED for a single source;
  #     `representation: docx` MUST use `content_file`;
  #   - OR a dual-source `content: {latex: ..., html: ...}` (NO representation)
  #     when the two surfaces need different markup;
  #   - `title: ""` for an untitled page (the renderers skip an empty heading).
  # latex is native to the Overleaf bundle, html to the in-app preview; a
  # single-surface node shows a short pending note on the other surface.
  # freeform-page forces its own page; freeform-block inserts inline (no break).
  #
  # - id: legal-notice                 # inline LaTeX, native to the bundle
  #   type: freeform-page
  #   title: Legal Notice
  #   representation: latex
  #   content: |
  #     \textbf{For research use only.} Not for diagnostic procedures.
  #
  # - id: data-availability            # inline HTML, native to the preview
  #   type: freeform-block
  #   title: ""
  #   representation: html
  #   content: '<p>Data available at <a href="https://example.org">example.org</a>.</p>'
  #
  # - id: methods-addendum             # same content, per-surface markup
  #   type: freeform-page
  #   title: Methods Addendum
  #   content:
  #     latex: \emph{Supplementary methods.}
  #     html: <em>Supplementary methods.</em>
  #
  # - id: imported-appendix            # a Word doc → both surfaces at load
  #   type: freeform-page
  #   title: Imported Appendix
  #   representation: docx
  #   content_file: freeform/imported-appendix.docx


# ---------------------------------------------------------------------------
# organs — per-area organ ALLOWLIST (optional limiting factor)
# ---------------------------------------------------------------------------
# A sibling of `document` (loaded by document_template.load_report_organs).
# A MAPPING keyed by content AREA — the two places organ is a row/section axis:
#
#   genomics      — the genomics sections (and their charts, narratives, gene
#                   tables, all of which read the same filtered sections dict)
#   organ-weight  — the Organ Weight apical table AND its findings narrative
#
# Each value is a list of organ tokens.  An OMITTED area key (or an empty list)
# ⇒ NO filtering for that area; omit the whole block ⇒ no filtering anywhere
# (the default, and what ships here).  An unknown area key fails loudly at load.
#
# Matching is case-insensitive and COMPONENT-AWARE
# (table_builder_common.organ_allowed): a token matches the whole organ string
# OR any `-`/space/`.`/`/`-separated component.  So `kidney` covers the genomics
# token "kidney" AND the apical laterality labels "Kidney-Left"/"Kidney-Right"/
# "R. Kidney", while "Liver"/"Heart" are dropped.  A listed organ absent from
# the data simply renders nothing (no note, no error).  Knowledge-base /
# enrichment (gene→organ associations) are intentionally NOT filtered.
#
# Note: editing `genomics` re-filters instantly (post-filter, no re-extraction);
# editing `organ-weight` forces a fresh section build (its output is cached).
# Example:
#
# organs:
#   genomics: [kidney]
#   organ-weight: [liver, kidney]
#
# The shared template selects NOTHING here or in the sibling blocks below: a
# study is reported in full — every organ, sex and endpoint its data has —
# unless it declares its own selections.  A study's selections live in its
# overlay, templates/studies/<dtxsid>/view.yaml (ADR-0027 §1; resolution in
# document_model/view_config.py), e.g. NIEHS-10's liver-only, male-only Table 3
# and hand-curated "Select" endpoints in templates/studies/DTXSID50469320/.


# ---------------------------------------------------------------------------
# sex / assays / genes / gene_sets — the sibling per-content allowlists
# ---------------------------------------------------------------------------
# Four more limiting factors, each a sibling of `document` and built on the same
# rail as `organs` (document_template.load_report_{sex,assays,genes,gene_sets} +
# the table_builder_common matchers).  Every block is OPTIONAL; an omitted block
# (or empty list) ⇒ no filtering for that axis.  All ship omitted here (a
# study's own selections go in its overlay — see `organs` above).
#
#   sex          — per-area MAPPING, areas {apical, genomics}.  EXACT match
#                  (male|female).  `apical` narrows the columns of every apical
#                  table + the BMD summary + the apical narratives; `genomics`
#                  drops whole organ×sex genomics sections.  Editing `apical`
#                  forces a fresh section build (cached); `genomics` re-filters
#                  instantly (post-filter, no re-extraction).
#
#   assays       — per-area MAPPING, areas {clinical-chemistry, hematology}
#                  ONLY (Hormones is always shown in full).  COMPONENT-AWARE
#                  match on the endpoint label, so one token can cover a family
#                  (`count` keeps "Basophil count" / "Leukocyte Count") or a
#                  single endpoint ("alanine aminotransferase").  Folds into the
#                  section cache like organ-weight.
#
#   genes        — FLAT list of gene symbols (genomics only).  Component-aware
#                  (single-token in practice) match on top_genes[].gene_symbol.
#                  Post-filter, no re-extraction.
#
#   gene_sets    — FLAT list of GO terms (genomics only).  A token matches the
#                  GO accession ("GO:0051301") OR a component of the readable
#                  term ("division" keeps "cell division").  Post-filter.
#
# Example (uncomment + edit to limit):
#
# sex:
#   apical: [male]
#   genomics: [male]
# genes: [egr1, ddit4]
# gene_sets: ["GO:1902893", "cell division"]




# ---------------------------------------------------------------------------
# charts — genomics chart-type ALLOWLIST (optional limiting factor)
# ---------------------------------------------------------------------------
# A sibling of `document` (loaded by document_template.load_report_charts),
# honored by genomics_charts.attach_genomics_charts on BOTH render paths (HTML
# preview + Overleaf export).  A LIST of the chart TYPE KEYS to render — the two
# built-ins (`umap`, `cluster`) plus any type declared in `chart_types` below.
#
# Unlike the token allowlists above (whose empty/omitted form means "no
# filtering"), this block ranges over a CLOSED set of types, so presence is the
# switch:
#   - key ABSENT   ⇒ no filtering — every produced chart renders (the default);
#   - key PRESENT  ⇒ only the listed types render; `[]` renders NONE.
#
# The NIEHS reference report carries NO main-body genomics figures (its only
# figures are the Appendix C PCA/boxplots, which are appendix nodes, and the
# Appendix D BMDS flowcharts, which belong to a method this pipeline does not
# run) — so we ship `charts: []` to suppress the UMAP semantic maps and
# BMD/cluster scatters.  Set to `[umap, cluster]` to bring them back.
# ADR-0028 §6: facts of the report SERIES (not the study), written into the BITS
# <collection-meta> and <book-meta>.  Study facts — the report number (subtitle),
# DOI, publication date and authors — come from the session's front matter.
book_meta:
  collection:
    title: NIEHS Report Series
  series:
    title: NIEHS Report
    issn: 2768-5632
  publisher:
    name: National Institute of Environmental Health Sciences
    loc: Research Triangle Park (NC)
  permissions:
    license_href: https://creativecommons.org/publicdomain/zero/1.0/
    statement: This is a work of the US government and distributed under the terms of the Public Domain

# ADR-0029: how the BITS is packaged and where tables/figures sit.  The body's
# float (Bookshelf shows a card that opens the object); the appendices' are
# anchored in the text (shown in full) — as NIEHS-07 … 10 have them.
packaging: chunked
object_position:
  body: float
  back: anchor

charts: []


# ---------------------------------------------------------------------------
# chart_style — per-instance genomics-chart styling (optional)
# ---------------------------------------------------------------------------
# Four-layer deep-merge (chart_style.py): built-in defaults <- defaults <-
# types[type] <- instances[<organ>|<sex>|<type>].  Each layer is partial — it
# overrides only the keys it names; a nested leaf (e.g. marker.size) can be set
# without restating its siblings.  Lists (palette) replace wholesale.  Omit this
# whole block and the charts render exactly as the built-in defaults (the
# pre-feature look).
#
# Uncomment / edit to restyle.  The canonical key set is documented in
# chart_style.STYLE_KEY_SCHEMA; an unknown key is logged (typo catcher), not
# fatal.
#
# chart_style:
#   defaults:                       # applied to EVERY chart
#     paper_bgcolor: "#ffffff"
#   types:                          # applied to every instance of one type
#     cluster:
#       marker: { opacity: 0.9 }
#   instances:                      # applied to ONE chart: "<organ>|<sex>|<type>"
#     liver|male|umap:
#       marker: { size: 14 }

# ---------------------------------------------------------------------------
# chart_types — data-driven chart types (optional)
# ---------------------------------------------------------------------------
# Declare a NEW chart type entirely in config: a trace kind (scatter|bar|line)
# over named gene_set columns, with optional color grouping / size binding /
# sort / limit / axes.  No Python.  Required: trace, x, y.  The two built-in
# code types (umap, cluster) may NOT be redeclared here (loud error) — they
# need bespoke Python and stay golden-stable.
#
# Available gene_set columns: bmd, bmdl, direction, fishers_p, go_id, go_term,
# n_down, n_genes, n_genes_with_bmd, n_up, rank.
#
# Substitutions: ${dose_unit} in axis titles, {organ_title}/{sex_title} in
# captions.
#
# Ships DORMANT: the reference report has no main-body genomics charts, so no
# type is declared here and `charts: []` above suppresses the built-ins too.
# Uncomment (and add the type to `charts:`) to bring a data-driven figure back.
#
# chart_types:
#   bmd-bar:
#     trace: bar
#     x: go_term
#     y: bmd
#     color: direction          # one trace per distinct value
#     sort: { by: bmd, dir: asc }
#     limit: 20
#     axes:
#       x: { title: "GO Term", type: category }
#       y: { title: "BMD (${dose_unit})", type: log }
#     layout: { width: 1000, height: 500 }
#     caption: "BMD per GO term — {organ_title} ({sex_title})."

# ---------------------------------------------------------------------------
# styles — per-content-type typography & page flow (optional)
# ---------------------------------------------------------------------------
# Three-layer deep-merge (layout_style.py): defaults <- types[<content-type>]
# <- instances[<node-id>].  Each layer is partial — it overrides only the keys
# it names.  A single ABSTRACT, surface-agnostic spec that BOTH renderers
# translate: the LaTeX export wraps each node in a font/spacing group, the HTML
# preview emits the same spec as an inline-styled wrapper — so the two surfaces
# cannot drift (ADR-0006).  Omit this whole block (as shipped) and every surface
# renders exactly today's built-in look (the all-absent path is a no-op).
#
# Keys (layout_style.LAYOUT_KEY_SCHEMA) — a bad VALUE fails loudly at load, an
# unknown KEY is a non-fatal typo warning:
#   font_family: serif | sans | mono        color: "#rgb" | "#rrggbb"
#   font_size:   e.g. "11pt" (pt/mm/cm/in/em/ex)   line_height: number, e.g. 1.4
#   weight:      normal | bold               style: normal | italic
#   align:       left | right | center | justify
#   space_before / space_after: length       first_line_indent: length
#   break_before / break_after: auto | page   keep_together: true | false
#
# `types` keys are content types from render_capabilities.COMPONENT_CATALOG
# (narrative, heading-only, front-matter, appendix, table, bmd-summary,
# genomics-section, freeform-page, ...); `instances` keys are DocNode ids.
#
# styles:
#   defaults:                       # applied to EVERY element
#     font_family: serif
#     line_height: 1.4
#   types:                          # applied to every node of one content type
#     narrative:
#       align: justify
#       first_line_indent: "1.5em"
#     heading-only:
#       font_family: sans
#       weight: bold
#       break_before: page
#   instances:                      # applied to ONE node, keyed by DocNode id
#     background:
#       font_size: "10pt"

# ---------------------------------------------------------------------------
# PAGE BREAKS — the canonical, surface-agnostic pagination spec
# ---------------------------------------------------------------------------
# Every intended page break is declared here as `break_before: page` on the node
# that should START a new page (keyed by DocNode id under `instances`).  This is
# the SINGLE source of truth for pagination across all three surfaces:
#   - docx  -> pageBreakBefore on the node's first paragraph;
#   - LaTeX -> \clearpage before the node;
#   - HTML  -> break-before:page.
# We deliberately use break_before (a BOOLEAN toggle), never a standalone page
# break, so a break declared here COMPOSES IDEMPOTENTLY with a docx dotx style
# that already carries pageBreakBefore (both -> ONE boundary, no blank page).
# So the list below enumerates EVERY reference break — including ones the docx
# dotx auto-breaks via its heading styles (peer-review, abstract, results,
# summary, references) — so LaTeX/HTML (which have no style-break template)
# reproduce the same pagination.  The break set was verified against
# examples/NIEHS-10 PFHxSAm_Final.docx (which tables/appendices start a page).
styles:
  instances:
    # Front matter — new page before each of these sections.
    toc: { break_before: page }
    authors: { break_before: page }
    peer-review: { break_before: page }
    publication: { break_before: page }
    abstract: { break_before: page }
    # Body — Results/Summary/References head their own page (docx dotx also
    # auto-breaks these via 3-02a_Head1_NoNumber; listed for LaTeX/HTML parity).
    results: { break_before: page }
    summary: { break_before: page }
    references: { break_before: page }
    # Body apical tables that the reference puts on their own page (Tables 3/5/6;
    # Tables 2/4/7/8 flow after prose, so NO break on those nodes).
    table-organ-weight: { break_before: page }
    table-hematology: { break_before: page }
    table-hormones: { break_before: page }
    # Appendices — each starts a new page (reference breaks before every
    # appendix head; A/C/E carry authored bodies, B/D/F their data tables).
    appendix-a: { break_before: page }
    appendix-b: { break_before: page }
    appendix-c: { break_before: page }
    appendix-d: { break_before: page }
    appendix-e: { break_before: page }
    appendix-f: { break_before: page }
