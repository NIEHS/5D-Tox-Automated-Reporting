  children:
  - id: references
    type: narrative
    title: References
    data_key: references
  # Appendices A/D/E/F carry AUTHORED static content (the reference's plasma
  # method, BMD rules table, organ descriptions, supplemental manifest) as a
  # freeform-block child — dual-surface, one .tex + one .html per appendix
  # under templates/freeform/.  Appendix B renders the data-derived animal
  # roster (no child).  Appendix C stays a pending stub (its QC/eFDR figures
  # need transcriptomics data the pipeline does not retain).
  - id: appendix-a
    type: appendix
    title: Appendix A. Internal Dose Assessment
    children:
    - id: appendix-a-body
      type: freeform-block
      title: ""
      content_file:
        latex: freeform/appendix-a.tex
        html: freeform/appendix-a.html
  - id: appendix-b
    type: appendix
    title: Appendix B. Animal Identifiers
  - id: appendix-c
    type: appendix
    title: Appendix C. Transcriptomic Quality Control and Empirical False Discovery Rate
  - id: appendix-d
    type: appendix
    title: Appendix D. Benchmark Dose Model Recommendation and Selection Methodologies
    children:
    - id: appendix-d-body
      type: freeform-block
      title: ""
      content_file:
        latex: freeform/appendix-d.tex
        html: freeform/appendix-d.html
  - id: appendix-e
    type: appendix
    title: Appendix E. Organ Weight Descriptions
    children:
    - id: appendix-e-body
      type: freeform-block
      title: ""
      content_file:
        latex: freeform/appendix-e.tex
        html: freeform/appendix-e.html
  - id: appendix-f
    type: appendix
    title: Appendix F. Supplemental Data
    children:
    - id: appendix-f-body
      type: freeform-block
      title: ""
      content_file:
        latex: freeform/appendix-f.tex
        html: freeform/appendix-f.html
  # ── Freeform AUTHORED content (commented out — feature ships dormant) ──────
  # freeform-page / freeform-block carry content authored HERE (or in an
  # external file), not read from the pipeline.  Uncomment + adapt to insert a
  # one-off legal page, an externally-written appendix, a pasted block, etc.
  # See freeform_content.py and render_capabilities (COMPONENT_CATALOG).
  #
  # Authoring rules (validated at load):
  #   - exactly ONE of `content` (inline) or `content_file` (path under
  #     templates/);
  #   - `representation` ∈ {latex, html, docx}, REQUIRED for a single source;
  #     `representation: docx` MUST use `content_file`;
  #   - OR a dual-source `content: {latex: ..., html: ...}` (NO representation)
  #     when the two surfaces need different markup;
  #   - `title: ""` for an untitled page (the renderers skip an empty heading).
  # latex is native to the Overleaf bundle, html to the in-app preview; a
  # single-surface node shows a short pending note on the other surface.
  # freeform-page forces its own page; freeform-block inserts inline (no break).
  #
  # - id: legal-notice                 # inline LaTeX, native to the bundle
  #   type: freeform-page
  #   title: Legal Notice
  #   representation: latex
  #   content: |
  #     \textbf{For research use only.} Not for diagnostic procedures.
  #
  # - id: data-availability            # inline HTML, native to the preview
  #   type: freeform-block
  #   title: ""
  #   representation: html
  #   content: '<p>Data available at <a href="https://example.org">example.org</a>.</p>'
  #
  # - id: methods-addendum             # same content, per-surface markup
  #   type: freeform-page
  #   title: Methods Addendum
  #   content:
  #     latex: \emph{Supplementary methods.}
  #     html: <em>Supplementary methods.</em>
  #
  # - id: imported-appendix            # a Word doc → both surfaces at load
  #   type: freeform-page
  #   title: Imported Appendix
  #   representation: docx
  #   content_file: freeform/imported-appendix.docx


# ---------------------------------------------------------------------------
# organs — per-area organ ALLOWLIST (optional limiting factor)
# ---------------------------------------------------------------------------
# A sibling of `document` (loaded by document_template.load_report_organs).
# A MAPPING keyed by content AREA — the two places organ is a row/section axis:
#
#   genomics      — the genomics sections (and their charts, narratives, gene
#                   tables, all of which read the same filtered sections dict)
#   organ-weight  — the Organ Weight apical table AND its findings narrative
#
# Each value is a list of organ tokens.  An OMITTED area key (or an empty list)
# ⇒ NO filtering for that area; omit the whole block ⇒ no filtering anywhere
# (the default, and what ships here).  An unknown area key fails loudly at load.
#
# Matching is case-insensitive and COMPONENT-AWARE
# (table_builder_common.organ_allowed): a token matches the whole organ string
# OR any `-`/space/`.`/`/`-separated component.  So `kidney` covers the genomics
# token "kidney" AND the apical laterality labels "Kidney-Left"/"Kidney-Right"/
# "R. Kidney", while "Liver"/"Heart" are dropped.  A listed organ absent from
# the data simply renders nothing (no note, no error).  Knowledge-base /
# enrichment (gene→organ associations) are intentionally NOT filtered.
#
# Note: editing `genomics` re-filters instantly (post-filter, no re-extraction);
# editing `organ-weight` forces a fresh section build (its output is cached).
# Example:
#
# organs:
#   genomics: [kidney]
#   organ-weight: [liver, kidney]
organs:
  genomics: [liver, kidney]
  organ-weight: [liver]


# ---------------------------------------------------------------------------
# sex / assays / genes / gene_sets — the sibling per-content allowlists
# ---------------------------------------------------------------------------
# Four more limiting factors, each a sibling of `document` and built on the same
# rail as `organs` (document_template.load_report_{sex,assays,genes,gene_sets} +
# the table_builder_common matchers).  Every block is OPTIONAL; an omitted block
# (or empty list) ⇒ no filtering for that axis.  All ship omitted here (the
# default filters nothing beyond `organs` above).
#
#   sex          — per-area MAPPING, areas {apical, genomics}.  EXACT match
#                  (male|female).  `apical` narrows the columns of every apical
#                  table + the BMD summary + the apical narratives; `genomics`
#                  drops whole organ×sex genomics sections.  Editing `apical`
#                  forces a fresh section build (cached); `genomics` re-filters
#                  instantly (post-filter, no re-extraction).
#
#   assays       — per-area MAPPING, areas {clinical-chemistry, hematology}
#                  ONLY (Hormones is always shown in full).  COMPONENT-AWARE
#                  match on the endpoint label, so one token can cover a family
#                  (`count` keeps "Basophil count" / "Leukocyte Count") or a
#                  single endpoint ("alanine aminotransferase").  Folds into the
#                  section cache like organ-weight.
#
#   genes        — FLAT list of gene symbols (genomics only).  Component-aware
#                  (single-token in practice) match on top_genes[].gene_symbol.
#                  Post-filter, no re-extraction.
#
#   gene_sets    — FLAT list of GO terms (genomics only).  A token matches the
#                  GO accession ("GO:0051301") OR a component of the readable
#                  term ("division" keeps "cell division").  Post-filter.
#
# Example (uncomment + edit to limit):
#
# sex:
#   apical: [male]
#   genomics: [male]
# genes: [egr1, ddit4]
# gene_sets: ["GO:1902893", "cell division"]

# assays — restrict the Clinical Chemistry (Table 4), Hematology (Table 5) and
# Hormone (Table 6) tables to the reference's "Select" endpoints.  These are
# PER-SEX: the NIEHS reference shows different endpoints for males vs females
# (and the apical BMD summary, Table 8, lists the same per-sex set).  The
# reference's "Select" is a HAND-CURATED subset that a data-driven
# responsiveness gate does NOT reproduce (e.g. male Cholesterol is the only male
# clin-chem row but is not NTP-responsive), so each panel is an explicit
# allowlist.  An area value may be a flat list (both sexes) OR this
# {male:/female:} mapping.  Tokens are matched component-aware, so multi-word
# tokens ("manual hematocrit", "total thyroxine") are used where a single word
# would over-match (bare "thyroxine" would also keep "Free Thyroxine"; bare
# "count" spans every differential row).
assays:
  clinical-chemistry:
    male: [cholesterol]
    female: ["aspartate aminotransferase", "sorbitol dehydrogenase"]
  hematology:
    male: ["neutrophil count"]
    female: ["manual hematocrit"]
  hormones:
    # Our row labels are "Triiodothyronine" / "Total Thyroxine" (the reference
    # prints them "Total T3" / "Total T4").  Token "triiodothyronine" keeps the
    # T3 row; "total thyroxine" keeps Total Thyroxine but NOT "Free Thyroxine".
    male: ["triiodothyronine", "total thyroxine"]
    female: ["total thyroxine"]

# sex — the "organ-weight" area narrows ONLY the Organ Weight table (Table 3) to
# the sex(es) that had a responsive organ, matching the reference (its Table 3
# is "Summary of Liver Weights of MALE Rats" — female liver was not responsive,
# so female is dropped from that ONE table while every other apical table keeps
# both sexes).  Combined with `organs.organ-weight: [liver]` above, this yields
# the single-organ / single-sex table; organ_weight_table then titles it
# dynamically from what's shown.  Exact match (male|female).
sex:
  organ-weight: [male]


# ---------------------------------------------------------------------------
# charts — genomics chart-type ALLOWLIST (optional limiting factor)
# ---------------------------------------------------------------------------
# A sibling of `document` (loaded by document_template.load_report_charts),
# honored by genomics_charts.attach_genomics_charts on BOTH render paths (HTML
# preview + Overleaf export).  A LIST of the chart TYPE KEYS to render — the two
# built-ins (`umap`, `cluster`) plus any type declared in `chart_types` below.
#
# Unlike the token allowlists above (whose empty/omitted form means "no
# filtering"), this block ranges over a CLOSED set of types, so presence is the
# switch:
#   - key ABSENT   ⇒ no filtering — every produced chart renders (the default);
#   - key PRESENT  ⇒ only the listed types render; `[]` renders NONE.
#
# The NIEHS reference report carries NO main-body genomics figures (its only
# figures are Appendix C PCA/boxplots and Appendix D flowcharts, none of which
# we generate) — so we ship `charts: []` to suppress the UMAP semantic maps and
# BMD/cluster scatters.  Set to `[umap, cluster]` to bring them back.
charts: []


# ---------------------------------------------------------------------------
# chart_style — per-instance genomics-chart styling (optional)
# ---------------------------------------------------------------------------
# Four-layer deep-merge (chart_style.py): built-in defaults <- defaults <-
# types[type] <- instances[<organ>|<sex>|<type>].  Each layer is partial — it
# overrides only the keys it names; a nested leaf (e.g. marker.size) can be set
# without restating its siblings.  Lists (palette) replace wholesale.  Omit this
# whole block and the charts render exactly as the built-in defaults (the
# pre-feature look).
#
# Uncomment / edit to restyle.  The canonical key set is documented in
# chart_style.STYLE_KEY_SCHEMA; an unknown key is logged (typo catcher), not
# fatal.
#
# chart_style:
#   defaults:                       # applied to EVERY chart
#     paper_bgcolor: "#ffffff"
#   types:                          # applied to every instance of one type
#     cluster:
#       marker: { opacity: 0.9 }
#   instances:                      # applied to ONE chart: "<organ>|<sex>|<type>"
#     liver|male|umap:
#       marker: { size: 14 }

# ---------------------------------------------------------------------------
# chart_types — data-driven chart types (optional)
# ---------------------------------------------------------------------------
# Declare a NEW chart type entirely in config: a trace kind (scatter|bar|line)
# over named gene_set columns, with optional color grouping / size binding /
# sort / limit / axes.  No Python.  Required: trace, x, y.  The two built-in
# code types (umap, cluster) may NOT be redeclared here (loud error) — they
# need bespoke Python and stay golden-stable.
#
# Available gene_set columns: bmd, bmdl, direction, fishers_p, go_id, go_term,
# n_down, n_genes, n_genes_with_bmd, n_up, rank.
#
# Substitutions: ${dose_unit} in axis titles, {organ_title}/{sex_title} in
# captions.
#
# Ships DORMANT: the reference report has no main-body genomics charts, so no
# type is declared here and `charts: []` above suppresses the built-ins too.
# Uncomment (and add the type to `charts:`) to bring a data-driven figure back.
#
# chart_types:
#   bmd-bar:
#     trace: bar
#     x: go_term
#     y: bmd
#     color: direction          # one trace per distinct value
#     sort: { by: bmd, dir: asc }
#     limit: 20
#     axes:
#       x: { title: "GO Term", type: category }
#       y: { title: "BMD (${dose_unit})", type: log }
#     layout: { width: 1000, height: 500 }
#     caption: "BMD per GO term — {organ_title} ({sex_title})."

# ---------------------------------------------------------------------------
# styles — per-content-type typography & page flow (optional)
# ---------------------------------------------------------------------------
# Three-layer deep-merge (layout_style.py): defaults <- types[<content-type>]
# <- instances[<node-id>].  Each layer is partial — it overrides only the keys
# it names.  A single ABSTRACT, surface-agnostic spec that BOTH renderers
# translate: the LaTeX export wraps each node in a font/spacing group, the HTML
# preview emits the same spec as an inline-styled wrapper — so the two surfaces
# cannot drift (ADR-0006).  Omit this whole block (as shipped) and every surface
# renders exactly today's built-in look (the all-absent path is a no-op).
#
# Keys (layout_style.LAYOUT_KEY_SCHEMA) — a bad VALUE fails loudly at load, an
# unknown KEY is a non-fatal typo warning:
#   font_family: serif | sans | mono        color: "#rgb" | "#rrggbb"
#   font_size:   e.g. "11pt" (pt/mm/cm/in/em/ex)   line_height: number, e.g. 1.4
#   weight:      normal | bold               style: normal | italic
#   align:       left | right | center | justify
#   space_before / space_after: length       first_line_indent: length
#   break_before / break_after: auto | page   keep_together: true | false
#
# `types` keys are content types from render_capabilities.COMPONENT_CATALOG
# (narrative, heading-only, front-matter, appendix, table, bmd-summary,
# genomics-section, freeform-page, ...); `instances` keys are DocNode ids.
#
# styles:
#   defaults:                       # applied to EVERY element
#     font_family: serif
#     line_height: 1.4
#   types:                          # applied to every node of one content type
#     narrative:
#       align: justify
#       first_line_indent: "1.5em"
#     heading-only:
#       font_family: sans
#       weight: bold
#       break_before: page
#   instances:                      # applied to ONE node, keyed by DocNode id
#     background:
#       font_size: "10pt"
