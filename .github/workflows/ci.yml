# ---------------------------------------------------------------------------
# CI — lint + unit/integration tests.
#
# Why this shape:
#   * bmdx-pipe lives in this repo as the uv workspace member
#     packages/bmdx-pipe (pyproject.toml [tool.uv.workspace]), so one checkout
#     and one `uv sync` install both; no sibling repo or token is needed.
#   * e2e (Playwright) tests are already excluded by pyproject's addopts;
#     they are an interactive walkthrough, not a regression suite.
#   * Tests that need the PROCESSED golden session (a GCS mount that exists
#     only on the author's machines) skip themselves via the
#     `real_session_50469320` fixture in tests/conftest.py.
#   * Java / BMDS / LLM calls are mocked by tests/conftest.py, so no JDK,
#     TeX Live or API key is needed here.
# ---------------------------------------------------------------------------
name: CI

# Trigger is MANUAL (Actions tab → CI → Run workflow). Add `push:` /
# `pull_request:` triggers to run it on every change.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (dev group includes pytest + ruff)
        run: uv sync --group dev

      - name: Lint (ruff — pyflakes + syntax subset, see pyproject.toml)
        run: uv run ruff check .

      - name: Unit + integration tests
        run: uv run pytest tests/unit tests/integration -p no:cacheprovider

      - name: bmdx-pipe tests
        run: uv run pytest packages/bmdx-pipe/tests -p no:cacheprovider
