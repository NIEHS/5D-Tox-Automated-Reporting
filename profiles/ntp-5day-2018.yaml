# Method profile ntp-5day-2018 — ADR-0027.
#
# The analysis method of the NTP/NIEHS 5-day reports of 2018–2020 (NTP RR-8,
# NIEHS Reports 02 – 06): Affymetrix arrays analysed with BMDExpress 2.20/2.30,
# apical BMDs from BMDS 2.7.  Reference: NIEHS-02 (EHDP, NBK549585).
#
# The apical statistics and plasma rules are those of ntp-5day-2021.1 (the same
# Jonckheere / Williams-or-Dunnett / Shirley-or-Dunn procedure, as the books'
# Statistical Methods state it).  What differs is the genomic reporting the
# books' Methods state ("Gene Ontology Analysis", "Individual Gene Analysis"):
# - GO terms with >=10 and <=250 annotated genes on the platform, active when at
#   least 5% populated and with 3 genes passing the probe filters;
# - genes: the gene's BMD, BMDL and BMDU are the medians over its probe sets
#   (BMDExpress's Defined Category Analysis on the individual-gene file, which
#   the deposited projects hold), and "genes with probe sets that had a median
#   fold change <|2| were removed prior to reporting".
# The BMD below 1/3 of the lowest non-zero dose prints "<x (NR)" in every era.
#
# IMMUTABLE once a report references it.  `null` = not settled by a published
# report ("to confirm"); it resolves to the built-in default and is reported.
#
# Conformance record (accepted deviations):
# - apical BMDs: BMDS 2.7 is not an engine this tool runs yet; processing uses
#   ToxicR model averaging and says so (as ntp-5day-2021.1).
# - eligibility "all_endpoints" is not implemented; the trend-and-pairwise gate
#   is used, and said so.
# - The deposited projects were annotated differently from the runs the books
#   report (NIEHS-02 GO "xenobiotic catabolic process": 5/15 genes in the
#   project, 5/18 in the book), so GO and gene tables follow these rules
#   without reproducing the books' numbers exactly.
name: ntp-5day-2018
series: ntp-5day
effective: "2018"
reference: NIEHS-02
description: >-
  NTP/NIEHS 5-day studies on Affymetrix arrays analysed with BMDExpress 2.20/2.30
  and BMDS 2.7 (NTP RR-8, NIEHS Reports 02 to 06).

apical:
  statistics:
    trend_test: jonckheere
    trend_select_p: 0.01
    alpha: 0.05
    alpha_strong: 0.01
    min_group_n: 2
    pairwise:
      Body Weight: williams_or_dunnett
      Organ Weight: williams_or_dunnett
      Clinical Chemistry: shirley_or_dunn
      Hematology: shirley_or_dunn
      Hormones: shirley_or_dunn
      Urinalysis: shirley_or_dunn
    outliers: null
  bmd:
    engine: bmds_2_7_high_dose_drop
    eligibility: all_endpoints
    bmr_when_unrecorded:
      default: {type: sd, factor: 1.0}
    acceptance: null      # the BMDS 2.7 acceptance rules — to confirm
  # NIEHS-02's book prints Globulin, the A/G ratio and a tested terminal body
  # weight (matched cell for cell, 2026-11-09).
  derived_endpoints: [globulin, ag_ratio]
  terminal_body_weight_tested: true

internal_dose:
  pairwise: none
  below_limit: half_limit
  bd_if_detected_share_at_most: 0.2
  outliers: {test: none}
  sig_figs: 3

genomics:
  go_ranking: [median]
  go_display: {pct: 5, min_genes: 10, max_genes: 250, min_bmd: 3}
  gene_min_fold_change: 2
  recorded:
    bmr: {type: sd, factor: 1.0}
    model_selection: lowest_aic
  efdr: null              # the 2018 books report no empirical FDR
