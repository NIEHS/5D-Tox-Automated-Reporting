# Method profile ntp-5day-2021.1 — ADR-0027.
#
# The analysis method of the NIEHS 5-day reports of 2021–2023 (NIEHS Reports
# 07 – 10): BMDExpress 2.30 genomics, apical BMDs from modified BMDS 2.7 with
# high-dose dropping.  Reference: NIEHS-10 (PFHxSAm, NBK589955).
#
# The same method as ntp-5day-2021, with the plasma concentration rules that
# profile left unsettled, as the lab's PA48 summaries and the books' Table 7
# state them: a group is BD (below detection) unless over 20% of its values are
# above the limit, and no outlier test is applied.  These reproduce every
# Table 7 cell of NIEHS-07, 08, 09 and 10 (tests/unit/test_plasma_table_rules.py).
# ntp-5day-2021 stays as it was for the studies pinned to it.
#
# IMMUTABLE once a report references it.  `null` = not settled by a published
# report ("to confirm"); it resolves to the built-in default and is reported.
#
# Conformance record (accepted deviations):
# - apical BMDs: modified BMDS 2.7 with high-dose dropping is not an engine
#   this tool has; processing under this profile uses ToxicR model averaging
#   and says so (decided 2026-10-01: validate apical BMDs with BMDS 2.7 later).
# - eligibility "all_endpoints" (every endpoint modelled) likewise is not
#   implemented; the trend-and-pairwise gate is used, and said so.
name: ntp-5day-2021.1
series: ntp-5day
effective: "2021.1"
reference: NIEHS-10      # tests/fixtures/reference/NIEHS-10
description: >-
  NIEHS 5-day studies analysed with BMDExpress 2.30 and modified BMDS 2.7
  (NIEHS Reports 07 to 10).

apical:
  statistics:
    # tests/unit/test_reference_conformance.py (NIEHS-10 PA06/41/43); the same
    # procedure reproduces NIEHS-07 to 09 (assets/cebs/NTP-STATS-CONFORMANCE.md).
    trend_test: jonckheere
    trend_select_p: 0.01
    alpha: 0.05
    alpha_strong: 0.01
    min_group_n: 2
    pairwise:
      Body Weight: williams_or_dunnett
      Organ Weight: williams_or_dunnett
      Clinical Chemistry: shirley_or_dunn
      Hematology: shirley_or_dunn
      Hormones: shirley_or_dunn
      Urinalysis: shirley_or_dunn
    outliers: null
  bmd:
    engine: bmds_2_7_high_dose_drop
    eligibility: all_endpoints
    bmr_when_unrecorded:
      default: {type: sd, factor: 1.0}
    acceptance: null      # the BMDS 2.7 acceptance rules — to confirm

internal_dose:
  # Plasma concentrations at hours after dosing (NIEHS-07 … 10 Table 7, from
  # the lab's PA48 summaries): no statistics; a group is BD unless over 20% of
  # its values are above the limit, and then values below the limit count at
  # half the limit; no outlier test.
  pairwise: none
  below_limit: half_limit
  bd_if_detected_share_at_most: 0.2
  outliers: {test: none}
  sig_figs: 3

genomics:
  go_ranking: null
  go_display: null
  recorded:
    bmr: {type: sd, factor: 1.0}
    model_selection: lowest_aic
