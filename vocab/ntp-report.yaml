# vocab/ntp-report.yaml — the NTP 5-day-tox report vocabulary (curated layer).
#
# TWO-LAYER design so regeneration never clobbers hand-curation:
#   - vocab/ntp-report-generated.yaml — AUTO-GENERATED from an example .docx by
#     `docx_style_extract --emit-vocabulary`.  One type per Word paragraph style,
#     named by slugified Word style name (report_title, head1_nonumber,
#     paragraph, table_title, …), specializes = the basedOn parent, style = the
#     delta, bind.docx = the real Word style name.  REGENERATE this file when the
#     template changes; do NOT hand-edit it.
#   - THIS file — the stable, curated CANONICAL ROLE layer.  It `extends` the
#     generated vocabulary and adds a handful of canonical role ALIASES that the
#     node→role crosswalk (render_capabilities.emits) references by stable name,
#     each specializing the concrete auto-generated NTP type.  This decouples the
#     crosswalk's stable vocabulary from the template's incidental style NAMES:
#     a template rename only touches the generated file + one alias's specializes.
#
# The canonical roles below are the ones render_capabilities.COMPONENT_CATALOG
# `emits`.  Adding a new section that needs a new role = add a catalog `emits`
# entry + a canonical alias here pointing at the concrete generated type.

vocabulary: ntp-report
extends: ntp-report-generated
types:
  # Canonical-role aliases each carry an explicit `bind.docx` = the real Word
  # style name, because a binding does NOT inherit through `specializes` (a
  # distinct type normally wants a distinct Word style).  Phase-2 docx rendering
  # applies these Word style names as pStyle, so the alias must name the concrete
  # NTP style, not its own auto-derived slug.

  # Body prose paragraph (0-03_Paragraph).
  body_para:
    specializes: paragraph
    bind:
      docx: "0-03_Paragraph"

  # Section headings by level (3-02a/03a/04a_HeadN_NoNumber).  The default
  # `section_heading` is level 1; the handler selects the level-specific role
  # directly for deeper headings.
  # outline_level (0-based) is what a Word TOC field / Navigation pane collects
  # by; the NTP 3-0Na styles carry none of their own, so we stamp it per level.
  section_heading:
    specializes: head1_nonumber
    style: { outline_level: 0 }
    bind:
      docx: "3-02a_Head1_NoNumber"
  section_heading_1:
    specializes: head1_nonumber
    style: { outline_level: 0 }
    bind:
      docx: "3-02a_Head1_NoNumber"
  section_heading_2:
    specializes: head2_nonumber
    style: { outline_level: 1 }
    bind:
      docx: "3-03a_Head2_NoNumber"
  section_heading_3:
    specializes: head3_nonumber
    style: { outline_level: 2 }
    bind:
      docx: "3-04a_Head3_NoNumber"

  # Appendix headings (4-05/4-06_Appendix_Head_N).
  appendix_heading:
    specializes: appendix_head_1
    style: { outline_level: 0 }
    bind:
      docx: "4-05_Appendix_Head_1"
  appendix_heading_1:
    specializes: appendix_head_1
    style: { outline_level: 0 }
    bind:
      docx: "4-05_Appendix_Head_1"
  appendix_heading_2:
    specializes: appendix_head_2
    style: { outline_level: 1 }
    bind:
      docx: "4-06_Appendix_Head_2"

  # A table body cell / table-internal paragraph → the real 0-29_Table_Body style
  # (10pt over Base_Text), now pulled into the generated layer via always_include.
  # Explicit docx bind: this canonical name IS the 0-29_Table_Body Word style
  # (bind does not inherit through specializes — a distinct type usually wants a
  # distinct Word style, so an alias that reuses its parent's must say so).
  table_body_cell:
    specializes: table_body
    bind:
      docx: "0-29_Table_Body"

  # NB report_subtitle (1-04_Report_Subtitle) and report_number (1-05a_Report-
  # Number) are now REAL generated types (always_include pulls them in even though
  # the example bodies don't apply them), so they need no curated alias — the
  # crosswalk names resolve straight to the generated types.  Do NOT redefine them
  # here: a curated type of the same name would override the real generated one.

  # The title-page location line (Research Triangle Park...) → NTP Publisher
  # Location (basedOn 1-09_Publication_Department, +16pt before).  Canonical role
  # name the content builder emits; explicit docx bind (bind doesn't inherit
  # through specializes).
  publisher_location:
    specializes: ntp_publisher_location
    bind:
      docx: "NTP Publisher Location"
